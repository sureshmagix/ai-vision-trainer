name: AI Vision Trainer CI

on:
  push:
    branches: [ main, "phase-**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-and-worker-checks:
    name: Backend & Worker CI (CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest httpx

      - name: Run linting
        run: |
          ruff check backend/app backend/tests worker/

      - name: Run backend tests
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          DATABASE_SYNC_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-key-for-ci-pipeline-only
        run: |
          cd backend
          pytest tests/ -v

      - name: Run worker tests
        run: |
          cd worker
          pytest tests/ -v

  frontend-checks:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run frontend tests
        run: |
          cd frontend
          npm run test:run

      - name: Build frontend distribution
        run: |
          cd frontend
          npm run build
